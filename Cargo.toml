[workspace]
members = [
    "crates/lios-application",
    "crates/lios-cli",
    "crates/lios-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "git@github.com:Lingbou/Lios.git"

[profile.dev]
opt-level = 1
debug-assertions = false
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 0
debug-assertions = true
overflow-checks = true

[profile.test.package."*"]
opt-level = 0
