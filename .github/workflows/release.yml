name: Unsigned release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RUST_VERSION: "1.96.1"

jobs:
  verify:
    name: Verify source and release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a protected release tag
        if: ${{ !github.ref_protected }}
        shell: bash
        run: |
          echo "::error::release tags must be covered by a GitHub tag ruleset or protection rule"
          exit 1

      - name: Check out the tagged source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the release commit to be on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::release tag must point to a commit already merged into ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag and synchronized versions
        id: version
        shell: bash
        run: |
          version="$(node scripts/version.mjs print)"
          node scripts/version.mjs check --tag "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Test frontend logic
        run: npm run test:frontend

      - name: Test frontend components
        run: npm run test:components

      - name: Build frontend
        run: npm run build

  desktop-windows:
    name: Build Windows desktop installer
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add --toolchain $env:RUST_VERSION x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify unsigned install, unchanged PATH, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]

          function Assert-Unsigned([string] $Path) {
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne "NotSigned") {
              throw "$Path must remain unsigned in the current release policy: $($signature.Status)"
            }
          }

          function Assert-ValidAuthenticodeSignature([string] $Path) {
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne "Valid") {
              throw "$Path does not have a valid Authenticode signature: $($signature.StatusMessage)"
            }
          }

          Assert-Unsigned $installer.FullName

          $installDir = Join-Path $env:LOCALAPPDATA "Lios"
          if (Test-Path -LiteralPath $installDir) {
            throw "clean Windows runner already contains the Lios install directory: $installDir"
          }
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          "WINDOWS_SMOKE_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "silent NSIS install failed with exit code $($installProcess.ExitCode)"
          }

          $installedExecutable = Join-Path $installDir "lios-desktop.exe"
          $reservedCliExecutable = Join-Path $installDir "lios.exe"
          $webViewLoader = Join-Path $installDir "WebView2Loader.dll"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          foreach ($path in @($installedExecutable, $webViewLoader, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "NSIS install did not produce $path"
            }
          }
          Assert-Unsigned $installedExecutable
          Assert-Unsigned $uninstaller
          Assert-ValidAuthenticodeSignature $webViewLoader
          if (Test-Path -LiteralPath $reservedCliExecutable) {
            throw "Desktop installer must not claim the reserved CLI executable name: $reservedCliExecutable"
          }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -cne $originalUserPath) {
            throw "Desktop installer modified the current-user PATH"
          }

          $desktopProcess = $null
          try {
            $desktopProcess = Start-Process -FilePath $installedExecutable -PassThru
            if ($desktopProcess.WaitForExit(5000)) {
              throw "installed Desktop exited during the startup smoke test with code $($desktopProcess.ExitCode)"
            }
          } finally {
            if ($desktopProcess -and -not $desktopProcess.HasExited) {
              Stop-Process -Id $desktopProcess.Id -Force
              $desktopProcess.WaitForExit()
            }
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "silent NSIS uninstall failed with exit code $($uninstallProcess.ExitCode)"
          }
          foreach ($path in @($installedExecutable, $webViewLoader, $uninstaller)) {
            if (Test-Path -LiteralPath $path) {
              throw "silent NSIS uninstall left $path behind"
            }
          }
          if (Test-Path -LiteralPath $installDir) {
            throw "silent NSIS uninstall left the installation directory behind"
          }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -cne $originalUserPath) {
            throw "Desktop uninstaller modified the current-user PATH"
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets\lios-desktop-v$env:VERSION-windows-x86_64-nsis.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Clean up smoke-test installation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if ($env:WINDOWS_SMOKE_INSTALL_DIR) {
            $expectedInstallDir = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA "Lios")).TrimEnd("\")
            $smokeInstallDir = [IO.Path]::GetFullPath($env:WINDOWS_SMOKE_INSTALL_DIR).TrimEnd("\")
            if ($smokeInstallDir -cne $expectedInstallDir) {
              throw "refusing cleanup outside the expected Lios install directory: $smokeInstallDir"
            }
            $uninstaller = Join-Path $smokeInstallDir "uninstall.exe"
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $smokeInstallDir) {
              Remove-Item -LiteralPath $smokeInstallDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

  desktop-linux:
    name: Build Linux desktop packages
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            desktop-file-utils \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux desktop executable
        run: npx tauri build --no-bundle

      - name: Bundle DEB, RPM, and AppImage
        run: npx tauri bundle --ci --bundles deb,rpm,appimage

      - name: Verify and normalize Linux packages
        shell: bash
        run: |
          set -euo pipefail
          appimage_root="$(mktemp -d)"
          deb_root="$(mktemp -d)"
          cleanup() {
            rm -rf "$appimage_root" "$deb_root"
          }
          trap cleanup EXIT

          deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_file="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$deb" && test -n "$rpm_file" && test -n "$appimage"

          if dpkg-deb --contents "$deb" | grep -Fi WebView2Loader.dll >/dev/null; then
            echo "::error::DEB contains the Windows-only WebView2Loader.dll"
            exit 1
          fi
          dpkg-deb --extract "$deb" "$deb_root"
          desktop-file-validate "$deb_root/usr/share/applications/Lios.desktop"
          test -x "$deb_root/usr/bin/lios-desktop"
          test ! -e "$deb_root/usr/bin/lios"
          file "$deb_root/usr/bin/lios-desktop"

          mkdir -p release-assets
          rpm_abs="$(realpath "$rpm_file")"
          docker run --rm \
            --mount "type=bind,src=${rpm_abs},dst=/input/lios.rpm,readonly" \
            fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            bash -euo pipefail -c '
              rpm --version
              rpm_db="$(mktemp -d)"
              rpm --dbpath "$rpm_db" --initdb

              if ! rpm_contents="$(rpm --dbpath "$rpm_db" -qlp /input/lios.rpm 2>&1)"; then
                printf "%s\n" "$rpm_contents"
                echo "::error::Fedora RPM tooling could not inspect the package"
                exit 1
              fi
              if grep -Fiq WebView2Loader.dll <<<"$rpm_contents"; then
                echo "::error::RPM contains the Windows-only WebView2Loader.dll"
                exit 1
              fi
              if ! grep -Fxq "/usr/bin/lios-desktop" <<<"$rpm_contents"; then
                echo "::error::Desktop RPM does not install /usr/bin/lios-desktop"
                exit 1
              fi
              if grep -Fxq "/usr/bin/lios" <<<"$rpm_contents"; then
                echo "::error::Desktop RPM claims the reserved CLI path /usr/bin/lios"
                exit 1
              fi

              if ! verification="$(rpm --dbpath "$rpm_db" -K --nosignature /input/lios.rpm 2>&1)"; then
                printf "%s\n" "$verification"
                echo "::error::RPM digest verification failed"
                exit 1
              fi
              printf "%s\n" "$verification"
            '

          chmod +x "$appimage"
          (cd "$appimage_root" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          test -d "$appimage_root/squashfs-root"
          test -x "$appimage_root/squashfs-root/usr/bin/lios-desktop"
          test ! -e "$appimage_root/squashfs-root/usr/bin/lios"
          if find "$appimage_root/squashfs-root" -type f -iname WebView2Loader.dll -print -quit | grep -q .; then
            echo "::error::AppImage contains the Windows-only WebView2Loader.dll"
            exit 1
          fi

          cp "$deb" "release-assets/lios-desktop-v${VERSION}-linux-x86_64.deb"
          cp "$rpm_file" "release-assets/lios-desktop-v${VERSION}-linux-x86_64.rpm"
          cp "$appimage" "release-assets/lios-desktop-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  cli-linux:
    name: Build Linux CLI packages
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install CLI packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            dpkg-dev \
            file \
            libssl-dev \
            pkg-config
          cargo install --locked cargo-deb --version 3.7.0
          cargo install --locked cargo-generate-rpm --version 0.21.0

      - name: Build Linux CLI executable
        run: cargo build --release --locked -p lios-cli --bin lios

      - name: Bundle CLI DEB and RPM
        shell: bash
        run: |
          cargo deb -p lios-cli --no-build
          cargo generate-rpm -p crates/lios-cli

      - name: Verify and normalize CLI packages
        shell: bash
        run: |
          set -euo pipefail
          deb_root="$(mktemp -d)"
          cleanup() {
            rm -rf "$deb_root"
          }
          trap cleanup EXIT

          deb="$(find target/debian -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_file="$(find target/generate-rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$deb" && test -n "$rpm_file"

          if [[ "$(dpkg-deb --field "$deb" Package)" != "lios-cli" ]]; then
            echo "::error::CLI DEB package name must be lios-cli"
            exit 1
          fi
          if [[ "$(dpkg-deb --field "$deb" Architecture)" != "amd64" ]]; then
            echo "::error::CLI DEB architecture must be amd64"
            exit 1
          fi
          deb_depends="$(dpkg-deb --field "$deb" Depends)"
          printf 'CLI DEB dependencies: %s\n' "$deb_depends"
          for required_deb_dependency in libc6 libssl3; do
            if ! grep -Eq "(^|, )[[:space:]]*${required_deb_dependency}([[:space:](,]|$)" <<<"$deb_depends"; then
              echo "::error::CLI DEB is missing the runtime dependency $required_deb_dependency"
              exit 1
            fi
          done
          dpkg-deb --extract "$deb" "$deb_root"
          test -x "$deb_root/usr/bin/lios"
          test ! -e "$deb_root/usr/bin/lios-desktop"
          file "$deb_root/usr/bin/lios"
          deb_links="$(ldd "$deb_root/usr/bin/lios" 2>&1)"
          printf '%s\n' "$deb_links"
          if grep -Fq "not found" <<<"$deb_links"; then
            echo "::error::CLI DEB contains an executable with unresolved shared libraries"
            exit 1
          fi
          "$deb_root/usr/bin/lios" --help >/dev/null

          rpm_abs="$(realpath "$rpm_file")"
          docker run --rm \
            --mount "type=bind,src=${rpm_abs},dst=/input/lios-cli.rpm,readonly" \
            fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            bash -euo pipefail -c '
              rpm_db="$(mktemp -d)"
              rpm --dbpath "$rpm_db" --initdb

              if [[ "$(rpm --dbpath "$rpm_db" -qp --qf "%{NAME}" /input/lios-cli.rpm)" != "lios-cli" ]]; then
                echo "::error::CLI RPM package name must be lios-cli"
                exit 1
              fi
              if [[ "$(rpm --dbpath "$rpm_db" -qp --qf "%{ARCH}" /input/lios-cli.rpm)" != "x86_64" ]]; then
                echo "::error::CLI RPM architecture must be x86_64"
                exit 1
              fi
              if ! rpm_contents="$(rpm --dbpath "$rpm_db" -qlp /input/lios-cli.rpm 2>&1)"; then
                printf "%s\n" "$rpm_contents"
                echo "::error::Fedora RPM tooling could not inspect the CLI package"
                exit 1
              fi
              if ! grep -Fxq "/usr/bin/lios" <<<"$rpm_contents"; then
                echo "::error::CLI RPM does not install /usr/bin/lios"
                exit 1
              fi
              if grep -Fxq "/usr/bin/lios-desktop" <<<"$rpm_contents"; then
                echo "::error::CLI RPM claims the Desktop path /usr/bin/lios-desktop"
                exit 1
              fi

              if ! rpm_requires="$(rpm --dbpath "$rpm_db" -qpR /input/lios-cli.rpm 2>&1)"; then
                printf "%s\n" "$rpm_requires"
                echo "::error::Fedora RPM tooling could not inspect CLI runtime dependencies"
                exit 1
              fi
              printf "%s\n" "$rpm_requires"
              for required_rpm_dependency in \
                "libc.so.6()(64bit)" \
                "libcrypto.so.3()(64bit)" \
                "libssl.so.3()(64bit)"; do
                if ! grep -Fxq "$required_rpm_dependency" <<<"$rpm_requires"; then
                  echo "::error::CLI RPM is missing the runtime dependency $required_rpm_dependency"
                  exit 1
                fi
              done

              if ! verification="$(rpm --dbpath "$rpm_db" -K --nosignature /input/lios-cli.rpm 2>&1)"; then
                printf "%s\n" "$verification"
                echo "::error::CLI RPM digest verification failed"
                exit 1
              fi
              printf "%s\n" "$verification"
              rpm --dbpath "$rpm_db" -i --nodeps --nosignature /input/lios-cli.rpm
              test -x /usr/bin/lios
              test ! -e /usr/bin/lios-desktop
              /usr/bin/lios --help >/dev/null
            '

          mkdir -p release-assets
          cp "$deb" "release-assets/lios-cli-v${VERSION}-linux-x86_64.deb"
          cp "$rpm_file" "release-assets/lios-cli-v${VERSION}-linux-x86_64.rpm"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  prepare-release-assets:
    name: Prepare checksummed release assets
    needs:
      - verify
      - desktop-windows
      - desktop-linux
      - cli-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-*
          path: release-assets
          merge-multiple: true

      - name: Validate payload set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          payloads=(
            "lios-cli-v${VERSION}-linux-x86_64.deb"
            "lios-cli-v${VERSION}-linux-x86_64.rpm"
            "lios-desktop-v${VERSION}-linux-x86_64.AppImage"
            "lios-desktop-v${VERSION}-linux-x86_64.deb"
            "lios-desktop-v${VERSION}-linux-x86_64.rpm"
            "lios-desktop-v${VERSION}-windows-x86_64-nsis.exe"
          )
          mapfile -t actual_payloads < <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${actual_payloads[*]}" != "${payloads[*]}" ]]; then
            printf 'release payload set does not match the expected versioned assets\n' >&2
            printf 'expected:\n%s\n' "${payloads[*]}" >&2
            printf 'actual:\n%s\n' "${actual_payloads[*]}" >&2
            exit 1
          fi
          sha256sum "${payloads[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload complete release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish unsigned GitHub Release
    needs:
      - verify
      - prepare-release-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release asset set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Publish unsigned asset set
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)

          tag_ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          while [[ "$tag_type" == "tag" ]]; do
            tag_object="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::release tag no longer resolves to the workflow commit"
            exit 1
          fi

          notes=$'## Desktop\n- Windows x86_64: unsigned NSIS installer\n- Linux x86_64: unsigned DEB, RPM, and AppImage\n\n## CLI\n- Linux x86_64: unsigned DEB and RPM\n- No official tarball, bare binary, or ARM64 package is published\n\n## Security notice\n- This release intentionally has no Lios Authenticode, OpenPGP, or Sigstore signatures and no GitHub artifact attestations\n- Verify the six versioned packages against SHA256SUMS before installation\n- Windows may display an Unknown publisher or SmartScreen warning\n- Signed packages will be introduced in a future version; these assets will not be replaced in place'
          flags=(
            --verify-tag
            --generate-notes
            --notes "$notes"
            --title "Lios ${VERSION}"
          )
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${flags[@]}"
